<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta
      name="description"
      content="Animated, procedurally generated agent avatars for React Native."
    />
    <meta name="theme-color" content="#0b0e10" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style>
      /* The Studio's dark background while CanvasKit (about 3 MB) downloads, so the page doesn't sit blank and white. */
      body {
        margin: 0;
        background-color: #0b0e10;
      }
      #loading {
        margin: auto;
        color: #7d8a8f;
        font:
          600 13px system-ui,
          sans-serif;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- React replaces the loading text when the app mounts. -->
    <div id="root"><div id="loading">Loading…</div></div>
  </body>
</html>
