<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agent-avatar harness</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0e1113; color: #cfd6d8; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid #1f2629; position: sticky; top: 0; background: #0e1113; z-index: 1; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  header button, header select { background: #1a2124; color: #cfd6d8; border: 1px solid #2a3336; border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  header .fps { margin-left: auto; opacity: .6; font-variant-numeric: tabular-nums; }
  #grid { display: grid; grid-template-columns: 120px repeat(9, 1fr); gap: 8px; padding: 16px 20px; align-items: center; }
  #grid .colhead, #grid .rowhead { opacity: .55; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  #grid .colhead { text-align: center; }
  .tile { position: relative; aspect-ratio: 1; }
  .tile canvas { width: 100%; height: 100%; display: block; }
  #focus { display: flex; gap: 24px; padding: 8px 20px 24px; align-items: center; }
  #focus canvas { width: 320px; height: 320px; }
  #focus .meta { opacity: .7; }
  body.light { background: #f4f5f5; color: #1e2426; }
  body.light header { background: #f4f5f5; border-color: #e0e4e6; }
</style>
</head>
<body>
<header>
  <h1>agent-avatar · harness</h1>
  <button id="shuffle">Shuffle</button>
  <button id="theme">Light / dark</button>
  <label>Eyes <select id="eyes"><option value="#FFFFFF">white</option><option value="#111111">black</option></select></label>
  <span class="fps" id="fps"></span>
</header>
<div id="focus"><canvas id="focusCanvas" width="640" height="640"></canvas><div class="meta" id="focusMeta">Click a tile to inspect it here.</div></div>
<div id="grid"></div>
<script type="module" src="./dist/harness.js"></script>
</body>
</html>
